# `cargo audit`（CI の audit ジョブ）の例外。
#
# 例外は「なぜ許容するか」と「見直し時期」を必ず書く。無言の ignore を増やさない。
# ここに無い勧告が出たら CI が落ちる（＝依存更新か、理由つきの追加を判断する）。
#
# なお `cargo audit` の「警告」（unmaintained / unsound / yanked）はビルドを落とさない。
# 現在残っている警告は修正版が無い勧告で、**配布物（Windows / macOS）に入るかどうか**で
# 判断している。分類表は `docs/spec/07-decisions.md` §6.1 にある（新しい警告が出たら
# まずそこを見て、配布物へ入るかを確認してから ignore を足すか決める）。
[advisories]
ignore = [
    # rsa 0.9.10: Marvin Attack（タイミング経由の秘密鍵回復）。確認時点で修正版が無い。
    # 本アプリは RSA の秘密鍵演算を公開していない（`sqlx-mysql` 経由で lock に入るだけで、
    # 実際に使うのは SQLite のみ）。到達性が変わったらこの例外を見直す。
    # 見直し: 2027-03。
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0459: libsqlite3-sys 0.37.0 が同梱する SQLite 3.53.2 の
    # CVE-2026-119375（細工した DB と、ページサイズの異なる -wal を同時に開くと
    # 未初期化のページキャッシュが返る）。修正版は libsqlite3-sys >= 0.39.0 だが、
    # sqlx-sqlite 0.9.0 が `>=0.30.1, <0.38.0` に固定しており上げられない。
    # 本アプリはユーザー提供の DB を開かず、アプリ自身が作る DB だけを開く。
    # sqlx が修正版へ追随したらこの例外を削除する。
    # 見直し: 2026-12。
    "RUSTSEC-2026-0459",
]
