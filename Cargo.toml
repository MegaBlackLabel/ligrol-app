[workspace]
resolver = "3"
members = ["crates/nartik", "crates/core", "crates/app", "crates/mcp"]

[workspace.package]
version = "0.3.11"
edition = "2024"
license = "MIT"
authors = ["MegaBlackLabel"]

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
log = "0.4"


# webp のエンコード/デコード（libwebp）は C 実装で、デバッグビルドだと
# 最適化なしになり非常に遅い（1000px のページ 1 枚で数秒）。PDF のページ画像を
# 作る経路とカードのサムネイルがこれを使うため、dev プロファイルでも最適化する。
# （以前は同じ理由で mupdf-sys に同じ指定をしていた）
[profile.dev.package.libwebp-sys]
opt-level = 3

[profile.release]
# リリースビルドにデバッグ情報を含めない（ビルド高速化・バイナリ縮小）
debug = false
# `strip` は必ず明示する。**キーを消すだけでは効かない** — `debug = false` のとき cargo は
# 既定で `-C strip=debuginfo` を渡し、rustc の LLVM ベースの strip が `__LINKEDIT` の
# 文字列プールを 8 バイト境界に整列させない（`LC_SYMTAB.stroff % 8 == 4`）。macOS 27 の
# 厳しくなった dyld はこれを `mis-aligned LINKEDIT string pool` として拒否するため、
# proc-macro の dylib（`libsqlx_macros-*.dylib`）がロードできずビルドが落ちる
# （rust-lang/rust#157750、llvm/llvm-project#203678。`strip = true` でも同じ）。
strip = "none"
