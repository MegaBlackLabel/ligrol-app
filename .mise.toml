[tools]
rust = "1.98.1"

[tasks.run]
run = "cargo run -p ligrol"

[tasks.test]
run = "cargo test --workspace"

[tasks.build]
run = "cargo build --release"

[tasks.fmt]
run = "cargo fmt --all"

[tasks.lint]
run = "cargo clippy --workspace --all-targets -- -D warnings"

# 依存を変えたらライセンス一覧（crates/app/assets/third-party/licenses.json）を作り直す。
# 作り忘れは `cargo test -p ligrol` が検出する。
[tasks.licenses]
run = "cargo run -p ligrol --example regen_licenses"

# PDFium の動的ライブラリを crates/core/ に取得する（リポジトリにはコミットしない）。
# PDF を描画するテストは、これが無いとスキップされる。
[tasks.pdfium]
run = "bash scripts/fetch-pdfium.sh"
